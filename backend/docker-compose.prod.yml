services:
  redis:
    image: redis:7
    container_name: pricewatch-redis
    restart: unless-stopped
    env_file:
      - .env.prod
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else redis-server --appendonly yes; fi'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: pricewatch-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:-"-Xms512m -Xmx512m"}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  app:
    image: ${BACKEND_IMAGE}
    container_name: pricewatch-app
    restart: unless-stopped
    depends_on:
      - redis
      - elasticsearch
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8080:8080"

volumes:
  redis-data:
  elasticsearch-data:
